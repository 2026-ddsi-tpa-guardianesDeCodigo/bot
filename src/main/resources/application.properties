# Nunca hardcodear el token acá - se pasa por variable de entorno al correr el bot.
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# El bot corre siempre local (nunca se despliega a Render, ver README). Desde la Entrega 6 entra al
# sistema por el API Gateway: GATEWAY_URL apunta al deploy y se puede pisar para probar contra local.
gateway.url=${GATEWAY_URL:https://gateway-cqi4.onrender.com}
donadores.url=${gateway.url}/api/donadores-entidades
donaciones.url=${gateway.url}/api/donaciones
logistica.url=${gateway.url}/api/logistica
incentivos.url=${gateway.url}/api/incentivos

server.port=${PORT:8085}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

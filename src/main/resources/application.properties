# Nunca hardcodear el token acá - se pasa por variable de entorno al correr el bot.
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# El bot corre siempre local (nunca se despliega a Render, ver README) y habla solo con
# Donadores y Entidades - por default apunta a Render, sobreescribible para probar contra local.
donadores.url=${DONADORES_URL:https://donadores-3.onrender.com}

server.port=${PORT:8085}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
